name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 护栏 1：格式。2026-11-03 审计期间出现过「gofmt 未跑」的改动直接进工作区。
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未 gofmt："
            echo "$out"
            exit 1
          fi

      # 护栏 2：编码。历史上出现过文件被 GBK 重编码（中文变 mojibake、换行被吞），
      # 本地 go build 才发现；这里在 CI 先挡 BOM / 非法 UTF-8。
      - name: Check UTF-8 (no BOM / no mojibake)
        run: |
          bad=0
          while IFS= read -r f; do
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "含 BOM: $f"; bad=1
            fi
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "非法 UTF-8: $f"; bad=1
            fi
          done < <(git ls-files '*.go' '*.md')
          exit $bad

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Build (all packages)
        run: go build ./...
