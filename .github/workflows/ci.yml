name: CI

# 只做质量闸：格式、vet、竞态测试、构建、staticcheck、依赖/标准库漏洞。
# 本仓库是库，不产出部署物，因此没有 deploy job。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 钉 1.27.4，不要改成 "1.27"：GO-2026-6859 是 net/http 的
          # MaxBytesReader 头部竞态（1.27.3 及之前受影响），webhook 公网回调
          # 正好走这条路径。固定小版本才能保证每次构建都不是易受攻击的工具链。
          go-version: "1.27.4"
          cache: true

      - name: gofmt
        run: |
          # 有未格式化文件就列出并失败，避免格式化噪音混进后续 diff。
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          # 扫的是本 job 的工具链（1.27.4）与依赖，命中即失败：
          # 这是 GO-2026-6859 这类标准库问题唯一的自动化防线。
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
